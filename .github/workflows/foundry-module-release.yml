name: Foundry Module Release

# Fully automated — triggered on tag push.
#
# Operator flow (1 command after commit):
#   git tag v0.1.0 && git push origin v0.1.0
#
# What this workflow does end-to-end:
#   1. Validates the tag format vMAJOR.MINOR.PATCH[-prerelease]
#   2. Builds the Foundry module (pnpm + tsup, bundles @evf/shared-protocol + qrcode)
#   3. Builds the glasses app (packages/g2-app/dist, ADR-0019: Even Hub package + the
#      GitHub Pages page the pairing QR opens — see pages.yml), relay-only checked
#   4. Patches module.json `version` + `download` from the tag and version-stamps
#      the esmodule + stylesheet filenames (cache-bust); syncs app.json + packs the .ehpk
#   5. Zips the runtime assets (module.json + dist/ + lang/ + templates/ + styles/)
#   6. Extracts release notes from Changesets CHANGELOG.md (falls back to --generate-notes on first release)
#   7. Creates the GitHub Release on the tag
#   8. Uploads module.json + evenfoundryvtt.zip (REL-01) + evenfoundryvtt.ehpk as release assets
#
# ADR-0016 removed the Node bridge + Docker Compose (no GHCR image, former REL-02).
# ADR-0019 took the glasses app out of the module zip: Foundry ≥ 14.361 serves module
# HTML as text/plain, so the app ships as the .ehpk (release asset) and on GitHub Pages.
#
# After completion, the install URL works:
#   https://github.com/Aiacos/EvenFoundryVTT/releases/latest/download/module.json
#
# Same URL on Foundry desktop ("Install Module" → Manifest URL) and The Forge
# Bazaar ("+ Install Module from a Manifest"). Auto-update polls the URL.
#
# Manual override: workflow_dispatch lets you re-run for a specific tag
# without re-tagging (useful if a previous run failed).

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to (re-)release, e.g. v0.1.0'
        required: true
        type: string

# Top-level permissions removed; each job declares only what it needs (least privilege, T-19-02).

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # required for `gh release create` + `gh release upload`

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          # pnpm cache is handled by pnpm/action-setup below

      - name: Setup pnpm via corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.33.4 --activate
          pnpm --version

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Derive release tag + version
        id: vars
        run: |
          # Source: either push:tags (refs/tags/vX.Y.Z) or workflow_dispatch input
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
            echo "::error::Tag '$TAG' does not match required vMAJOR.MINOR.PATCH[-prerelease] format"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved tag=$TAG version=$VERSION"

      - name: Build foundry-module bundle
        run: pnpm --filter @evf/foundry-module build

      # ADR-0019: one glasses-app bundle for the .ehpk and GitHub Pages, relay-only.
      - name: Build g2-app (packages/g2-app/dist)
        run: |
          pnpm --filter @evf/g2-app build
          node scripts/check-relay-origin.mjs --bundle packages/g2-app/dist

      - name: Patch module.json (version + download URL + cache-busting asset names)
        working-directory: packages/foundry-module
        env:
          VERSION: ${{ steps.vars.outputs.version }}
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          # Use a tiny Node one-liner — robust JSON edit, no jq dependency.
          #
          # CACHE-BUSTING (REL-05, remote 7f37b5f): Foundry/Forge loads the esmodule and
          # the stylesheet by STABLE URLs (`dist/module.js`, `styles/pair-g2.css`), so a
          # CDN/browser HTTP cache kept serving the OLD bundle after an upgrade (module
          # reported the new version while executing stale code). Every release therefore
          # version-stamps both filenames (`dist/module-<ver>.js`, `styles/pair-g2-<ver>.css`)
          # and repoints module.json at them. The committed module.json keeps the plain
          # names for local dev. The zip
          # excludes *.map, so the dangling sourceMappingURL comment is harmless.
          node -e "
            const fs = require('node:fs');
            const path = 'module.json';
            const ver = process.env.VERSION;
            const m = JSON.parse(fs.readFileSync(path, 'utf-8'));
            m.version = ver;
            m.download = 'https://github.com/${{ github.repository }}/releases/download/' + process.env.TAG + '/evenfoundryvtt.zip';
            const stamp = (file) => {
              const dot = file.lastIndexOf('.');
              const stamped = file.slice(0, dot) + '-' + ver + file.slice(dot);
              if (!fs.existsSync(file)) { console.error('::error::missing ' + file); process.exit(1); }
              fs.renameSync(file, stamped);
              if (fs.existsSync(file + '.map')) fs.renameSync(file + '.map', stamped + '.map');
              return stamped;
            };
            m.esmodules = (m.esmodules || []).map(stamp);
            m.styles = (m.styles || []).map(stamp);
            fs.writeFileSync(path, JSON.stringify(m, null, 2) + '\\n');
            console.log('Patched module.json → version=' + m.version + ', esmodules=' + JSON.stringify(m.esmodules) + ', styles=' + JSON.stringify(m.styles) + ', download=' + m.download);
          "
          head -30 module.json
          ls -la dist styles

      # Keep app.json in lockstep with the g2-app package version (remote 1fb33ce):
      # Even Hub rejects a local pack whose manifest version differs from the bundle.
      - name: Sync app.json version from g2-app package.json
        run: |
          node -e "const fs=require('node:fs'); \
            const ver=require('./packages/g2-app/package.json').version; \
            const p='packages/g2-app/app.json'; \
            const j=JSON.parse(fs.readFileSync(p,'utf8')); \
            j.version=ver; \
            fs.writeFileSync(p, JSON.stringify(j,null,2)+'\\n'); \
            console.log('app.json version =', ver)"

      # Same pack as evenhub-pack.yml: the player install (ADR-0019), attached to every
      # release so the Even Hub beta / store upload always matches the module release.
      - name: Pack evenfoundryvtt.ehpk
        run: |
          npx --yes @evenrealities/evenhub-cli@0.1.14 pack packages/g2-app/app.json packages/g2-app/dist --sdk-ver "$(node -p "require('./packages/g2-app/package.json').dependencies['@evenrealities/even_hub_sdk']")" -o packages/foundry-module/evenfoundryvtt.ehpk
          test -f packages/foundry-module/evenfoundryvtt.ehpk
          ls -lh packages/foundry-module/evenfoundryvtt.ehpk

      - name: Assemble release tree
        working-directory: packages/foundry-module
        run: |
          # Stage exactly the files Foundry needs at runtime — nothing else.
          mkdir -p release-tree
          cp module.json release-tree/
          cp -r dist release-tree/
          cp -r lang release-tree/
          cp -r templates release-tree/
          cp -r styles release-tree/
          ls -R release-tree
          # Every runtime path module.json references must be in the tree.
          node ../../scripts/check-module-assets.mjs release-tree

      - name: Create evenfoundryvtt.zip
        working-directory: packages/foundry-module/release-tree
        run: |
          zip -r ../evenfoundryvtt.zip . -x "*.map"  # exclude sourcemaps from runtime zip
          ls -la ../evenfoundryvtt.zip
          # Listing captured once: piping unzip into head/grep -q can SIGPIPE under pipefail.
          LISTING=$(unzip -Z1 ../evenfoundryvtt.zip)
          head -20 <<<"$LISTING"
          # ADR-0019: the glasses app is not part of the module anymore.
          if grep -q '^g2/' <<<"$LISTING"; then
            echo "::error::evenfoundryvtt.zip still ships g2/ (ADR-0019: the app lives on Even Hub + Pages)."
            exit 1
          fi

      # REL-04: Extract release notes from Changesets CHANGELOG.md files.
      # Aggregates user-facing packages: foundry-module (primary) + g2-app (the .ehpk asset).
      # Falls back to empty output when no CHANGELOG.md exists yet (first release, Pitfall 5).
      - name: Extract release notes from CHANGELOG.md
        id: notes
        env:
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          NOTES_FILE="/tmp/release-notes.md"
          FOUND=0

          # foundry-module CHANGELOG.md (primary — include if a matching entry exists).
          # GRACEFUL (remote 729521d): a missing entry is a "no match" signal, not a
          # release failure — `&& FOUND=1 || true` keeps the step green and falls through
          # to the g2-app block and, if nothing matched, the --generate-notes fallback.
          if test -f "packages/foundry-module/CHANGELOG.md"; then
            node -e "
              const fs = require('node:fs');
              const ver = process.env.VERSION;
              const log = fs.readFileSync('packages/foundry-module/CHANGELOG.md', 'utf-8');
              const escaped = ver.replace(/\\./g, '\\\\.');
              const m = log.match(new RegExp('## ' + escaped + '[\\\\s\\\\S]*?(?=\\n## |$)'));
              if (!m) { process.exit(1); }
              fs.appendFileSync('${NOTES_FILE}', m[0].trim() + '\\n');
            " && FOUND=1 || true
          fi

          # g2-app CHANGELOG.md (append if present)
          if test -f "packages/g2-app/CHANGELOG.md"; then
            node -e "
              const fs = require('node:fs');
              const ver = process.env.VERSION;
              const log = fs.readFileSync('packages/g2-app/CHANGELOG.md', 'utf-8');
              const escaped = ver.replace(/\\./g, '\\\\.');
              const m = log.match(new RegExp('## ' + escaped + '[\\\\s\\\\S]*?(?=\\n## |$)'));
              if (m) {
                fs.appendFileSync('${NOTES_FILE}', '\\n---\\n\\n' + m[0].trim() + '\\n');
              }
            " || true
          fi

          if [ "$FOUND" -eq 1 ]; then
            echo "notes_file=${NOTES_FILE}" >> "$GITHUB_OUTPUT"
            echo "Using CHANGELOG.md release notes:"
            cat "${NOTES_FILE}"
          else
            echo "No CHANGELOG.md found — will use --generate-notes fallback"
            echo "notes_file=" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.vars.outputs.tag }}
          NOTES_FILE: ${{ steps.notes.outputs.notes_file }}
        run: |
          # Idempotent: if the release already exists (manual creation or workflow re-run),
          # skip; otherwise create with CHANGELOG.md notes or auto-generated fallback.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — skipping creation."
          else
            # Mark pre-releases (anything with a hyphen after the version) automatically.
            PRERELEASE_FLAG=""
            if [[ "$TAG" == *"-"* ]]; then PRERELEASE_FLAG="--prerelease"; fi
            if [[ -n "$NOTES_FILE" ]]; then
              # REL-04: use Changesets-produced CHANGELOG.md notes (human-curated)
              gh release create "$TAG" \
                --title "$TAG" \
                --notes-file "$NOTES_FILE" \
                $PRERELEASE_FLAG
            else
              # Fallback: auto-generate notes from commit history (first release or missing CHANGELOG)
              gh release create "$TAG" \
                --title "$TAG" \
                --generate-notes \
                $PRERELEASE_FLAG
            fi
            echo "Created release $TAG"
          fi

      # REL-01 regression: module.json (manifest URL: /releases/latest/download/module.json)
      # + evenfoundryvtt.zip are the two canonical Foundry install assets. --clobber ensures
      # safe re-runs without manual deletion. These assets MUST remain present in every release.
      - name: Upload module.json + zip + ehpk to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          # --clobber: overwrite if the release already has these assets (re-run safety)
          # REL-01 contract: module.json serves /releases/latest/download/module.json
          # REL-01 contract: evenfoundryvtt.zip is the Foundry module runtime bundle
          gh release upload "$TAG" \
            packages/foundry-module/module.json \
            packages/foundry-module/evenfoundryvtt.zip \
            packages/foundry-module/evenfoundryvtt.ehpk \
            --clobber

      - name: Print install manifest URL
        env:
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          echo "::notice title=Module ready::Install URL → https://github.com/${{ github.repository }}/releases/latest/download/module.json"
          echo "::notice title=Version-pinned ZIP::https://github.com/${{ github.repository }}/releases/download/${TAG}/evenfoundryvtt.zip"
