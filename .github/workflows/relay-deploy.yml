# Relay deploy (ADR-0019) — `wrangler deploy` of packages/relay (Cloudflare Worker +
# one Durable Object per room) on every merge to main that touches it.
#
# One-time maintainer setup (docs/runbook.md §Relay and Pages): repository secrets
# CLOUDFLARE_API_TOKEN ("Edit Cloudflare Workers" template) and CLOUDFLARE_ACCOUNT_ID.
# Without them the job only tests the relay and warns — it never fails the pipeline.
# The deployed origin must equal DEFAULT_RELAY_URL (packages/shared-protocol) and the
# .ehpk whitelist (scripts/check-relay-origin.mjs); the health check below proves it.
name: Relay Deploy

on:
  push:
    branches: [main]
    paths: ['packages/relay/**', '.github/workflows/relay-deploy.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: relay-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Test the relay
        run: pnpm vitest --run --project relay

      - name: Deploy (wrangler)
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN is not set — relay tested but not deployed (docs/runbook.md)."
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pnpm --filter @evf/relay run deploy
          echo "deployed=true" >> "$GITHUB_OUTPUT"

      - name: Health check of the production relay
        if: steps.deploy.outputs.deployed == 'true'
        run: |
          URL=$(node -e "const s=require('fs').readFileSync('packages/shared-protocol/src/direct/relay.ts','utf8');console.log(s.match(/DEFAULT_RELAY_URL = '(wss:\/\/[^']+)'/)[1].replace(/^wss:/,'https:'))")
          curl -fsS --retry 5 --retry-delay 3 "$URL/health"
          echo " ← $URL/health"
