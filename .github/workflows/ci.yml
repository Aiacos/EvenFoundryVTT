# EVF CI Workflow — D-1.09 (GitHub Actions) + D-1.10 (7 quality gates) + ADR-0011/0016 guards
# Source: github.com/pnpm/action-setup (verified 2026-05-11)
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    # `edited` is required so commit-lint-pr-title re-evaluates when a PR title
    # is corrected — without it the default [opened, synchronize, reopened] left
    # a stale title-lint result that no title edit could clear (only a new push).
    types: [opened, synchronize, reopened, edited]
    branches: [main, develop]
  # Reused by release.yml to verify the Version Packages PR head in-pipeline (PRs
  # opened by github-actions[bot] may need approval before `pull_request` runs start).
  workflow_call:
    inputs:
      ref:
        description: Commit to verify (defaults to the triggering commit)
        type: string
        required: false
        default: ''

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || '' }}
          fetch-depth: 0  # changeset status --since=main needs full history

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # D-1.10 gate 1: deterministic install (T-01-01 mitigation)
      # --ignore-scripts avoids Husky prepare on shallow clone (Pitfall 4)
      - name: Install dependencies (frozen-lockfile + ignore-scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts

      # D-1.10 gate 2: Biome lint + format (read-only `ci` mode)
      - name: Biome CI
        run: pnpm biome ci .

      # D-1.10 gate 3: TS strict per package
      - name: TypeScript typecheck
        run: pnpm typecheck

      # D-1.10 gate 4: Vitest coverage
      - name: Vitest with coverage
        run: pnpm test:coverage

      # D-1.10 gate 5: // TODO discipline (INV-4)
      # Fails on any `// TODO` NOT followed by `(#NN)` or `(ADR-NNNN)`; one optional space
      # before the parenthesis is tolerated (`// TODO (#12)`, remote e1b2409).
      # Uses `git grep -P` (PCRE): the negative lookahead is not valid ERE — the former
      # `grep -E` form errored/never matched, so the gate silently passed. `git grep`
      # scans tracked files only (no node_modules / build output).
      - name: TODO discipline grep
        run: |
          if git grep -nP '// TODO(?! ?\((#[0-9]+|ADR-[0-9]+)\))' -- \
              'packages/*.ts' 'packages/*.tsx' 'packages/*.js' 'packages/*.mjs' \
              'scripts/*.mjs' 'scripts/*.ts'; then
            echo "::error::Found // TODO without (#issue) or (ADR-NNNN) reference (INV-4)"
            exit 1
          fi

      # D-1.10 gate 6: snapshot drift (Vitest fails when --update=false finds mismatch)
      - name: Snapshot drift check
        run: pnpm vitest --run --update=false

      # D-1.10 gate 7: changeset status (PR only — main branch doesn't need to declare changes)
      # Skipped on the Changesets "Version Packages" PR (head `changeset-release/*`):
      # that PR CONSUMES changesets and by design adds none, so `changeset status`
      # would always fail there. Feature PRs still require a declared changeset.
      - name: Changeset status
        if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'changeset-release/')
        run: pnpm changeset:status

      # Releases are tagged from @evf/foundry-module's version and its zip ships g2-app +
      # shared-*; a bump of those without the module would never reach Foundry/The Forge.
      - name: Changesets cover the shipped module
        run: node scripts/check-changeset-module.mjs

      # D-7.01 gate 8: Single-workflow-origin guard (ADR-0011, preserved by ADR-0016)
      # The ONLY valid call sites for activity.use() are under
      #   packages/foundry-module/src/write-path/
      # Any other hit (g2-app, shared-*, validation-harness, or foundry-module outside
      # write-path — e.g. the ADR-0016 projector) is a write bypass of the GM-side
      # dispatchTool pipeline — critical violation (T-07-01 mitigation).
      # @see docs/architecture/0011-foundry-write-path-single-workflow-origin.md
      # @see docs/architecture/0016-direct-foundry-streaming.md (Decision Outcome §5)
      - name: Single-workflow-origin guard (ADR-0011)
        run: |
          # Match real calls only. Post-filters drop (1) lines whose content (after
          # `path:NN:`) starts with a comment marker (JSDoc `*`, `//`, `/*`) and
          # (2) prose mentions of the empty-paren form `activity.use()` inside a string
          # literal (e.g. tool description 'Cast a spell via activity.use()'). Real
          # calls pass arguments or are not quote-enclosed, so they are never dropped.
          HITS=$(git grep -nE 'activity\.use\(' -- 'packages/*.ts' 'packages/*.tsx' \
              ':!packages/foundry-module/src/write-path/**' \
            | grep -vE ':[0-9]+:[[:space:]]*(\*|//|/\*)' \
            | grep -vE "['\"\`][^'\"\`]*activity\.use\(\)[^'\"\`]*['\"\`]" || true)
          if [ -n "$HITS" ]; then
            echo "$HITS"
            echo "::error::activity.use() call detected outside packages/foundry-module/src/write-path/."
            echo "::error::All mutations must go through the GM-side dispatchTool pipeline (write-path handlers)."
            echo "::error::See docs/architecture/0011-foundry-write-path-single-workflow-origin.md (ADR-0011)"
            exit 1
          fi

      # ADR-0016 gate 9: socketlib is a Foundry-side (GM client) dependency only.
      # The phone g2-app talks only to the relay (ADR-0019); shared-* are
      # environment-agnostic. Any socketlib import/call outside packages/foundry-module
      # is an architecture leak. (Replaces the former fixed handler-count assertion:
      # the gate must not depend on how many handlers foundry-module registers.)
      - name: socketlib confinement guard (ADR-0016)
        run: |
          HITS=$(git grep -nE \
              "from ['\"][^'\"]*socketlib|import\(['\"][^'\"]*socketlib|\bsocketlib\.(register|execute)[A-Za-z]*\(|modules\.get\(['\"]socketlib" \
              -- 'packages/*.ts' 'packages/*.tsx' ':!packages/foundry-module/**' \
            | grep -vE ':[0-9]+:[[:space:]]*(\*|//|/\*)' || true)
          if [ -n "$HITS" ]; then
            echo "$HITS"
            echo "::error::socketlib usage detected outside packages/foundry-module (ADR-0016)."
            echo "::error::Only the GM-client Foundry module may depend on socketlib."
            exit 1
          fi

      # ADR-0019 gate 10: one glasses-app bundle (packages/g2-app/dist) for the Even Hub
      # package and the GitHub Pages page; it talks only to the relay its app.json
      # whitelists, and carries no Foundry login / socket.io code (research F1).
      - name: Build g2-app + relay-only contract (ADR-0019)
        run: |
          pnpm --filter @evf/g2-app build
          if ! test -f packages/g2-app/dist/index.html; then
            echo "::error file=packages/g2-app/vite.config.ts::g2-app build did not emit packages/g2-app/dist/index.html."
            exit 1
          fi
          node scripts/check-relay-origin.mjs --bundle packages/g2-app/dist

      # ADR-0019 end-to-end: the relay of this commit (wrangler dev) + the real glasses
      # session + a projector speaking the real sealed protocol: code → rotate → new
      # room → online → map asset → invoke → projector away / back. Then the harness.
      - name: Relay end-to-end (wrangler dev + g2-app session + validate:relay)
        run: |
          (cd packages/relay && pnpm exec wrangler dev --port 8799 --ip 127.0.0.1 >/tmp/relay.log 2>&1 &)
          for _ in $(seq 1 90); do curl -fs http://127.0.0.1:8799/health >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:8799/health || { cat /tmp/relay.log; exit 1; }
          EVF_RELAY_URL=ws://127.0.0.1:8799 pnpm vitest --run packages/g2-app/src/direct/relay.e2e.test.ts
          RELAY_URL=ws://127.0.0.1:8799 pnpm --filter @evf/validation-harness validate:relay:skip-hardware

      # Wiki source (docs/wiki/) is published by wiki-sync.yml on main; break it here,
      # not after merge: unknown pages, missing images/files and orphan pages fail.
      - name: Wiki link check (docs/wiki)
        run: node scripts/check-wiki-links.mjs docs/wiki

      # CLAUDE.md P12 / constitution XII: TODO.md, SECURITY.md, CHANGELOG.md stay checkable,
      # referenced lists with P11 icons.
      - name: Tracking files (TODO / SECURITY / CHANGELOG)
        run: node scripts/check-tracking-files.mjs

      # Builds the module first: dist/module.js is a generated asset referenced by
      # module.json, so a clean runner must produce it before the check.
      - name: Module runtime assets (module.json references)
        run: |
          pnpm --filter @evf/foundry-module build
          node scripts/check-module-assets.mjs packages/foundry-module

      # Even Hub packaging: app.json version = g2-app package version, icon shipped.
      - name: Even Hub manifest (app.json version + icon)
        run: |
          node scripts/sync-app-json.mjs --check
          test -f packages/g2-app/dist/icon.png || { echo "::error file=packages/g2-app/app.json::icon.png missing from the g2 build (packages/g2-app/src/public/icon.png)"; exit 1; }

      # Shell scripts (wizard, sim helpers) are linted like the TypeScript sources.
      - name: ShellCheck (scripts/*.sh)
        run: shellcheck scripts/*.sh

  commit-lint-pr-title:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # T-01-04 mitigation: server-side commitlint cannot be bypassed by --no-verify
      # T-01-03 mitigation: PR title interpolated via env block (NOT inlined into bash run:),
      #                     preventing shell injection via crafted PR titles
      - name: Lint PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: echo "$PR_TITLE" | pnpm commitlint
