# EVF Auto-Release — merges the Changesets "Version Packages" PR and publishes, hands-off
#
# Why a separate workflow:
#   release.yml (changesets/action) opens/updates the "Version Packages" PR, but the
#   PR must be merged and the merge must trigger publishing. A merge performed with
#   the default GITHUB_TOKEN does NOT start `on: push` workflows (GitHub's
#   anti-recursion rule), so release.yml would never see it. `workflow_run` DOES fire
#   when the CI run on the version PR completes, so this workflow:
#     1. waits for CI (quality-gates) to succeed on the version PR's head commit,
#     2. merges that exact commit (--match-head-commit: nothing unverified ships),
#     3. runs `pnpm run release:tag` on the merged main — idempotent tag creation +
#        workflow_dispatch of foundry-module-release.yml (dispatch is allowed with
#        GITHUB_TOKEN), which builds the zip, publishes the GitHub Release and serves
#        module.json at /releases/latest/download/module.json (The Forge / Foundry
#        auto-update URL).
#
# No PAT or GitHub App is required. Branch protection on main stays in force: the
# merge only succeeds when the required `quality-gates` check has passed.

name: Auto-Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write       # merge + tag push
  pull-requests: write  # gh pr merge
  actions: write        # release-tag.mjs → gh workflow run foundry-module-release.yml

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  merge-and-publish:
    # Only a successful CI on the Changesets release branch, raised by its PR.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_branch == 'changeset-release/main'
    runs-on: ubuntu-latest
    steps:
      - name: Merge the verified Version Packages PR
        id: merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          PR=$(gh pr list --repo "$REPO" --state open --base main --head changeset-release/main \
                 --json number,headRefOid --jq '.[0]')
          if [ -z "$PR" ] || [ "$PR" = "null" ]; then
            echo "::notice::No open Version Packages PR — nothing to release."
            echo "merged=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          NUMBER=$(jq -r .number <<<"$PR")
          CURRENT=$(jq -r .headRefOid <<<"$PR")
          if [ "$CURRENT" != "$HEAD_SHA" ]; then
            echo "::notice::PR #$NUMBER moved on ($CURRENT ≠ verified $HEAD_SHA) — its own CI run will release it."
            echo "merged=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh pr merge "$NUMBER" --repo "$REPO" --merge --match-head-commit "$HEAD_SHA" \
            --subject "chore(release): version packages (#$NUMBER)"
          echo "merged=true" >> "$GITHUB_OUTPUT"
          echo "::notice title=Merged::Version Packages PR #$NUMBER"

      - uses: actions/checkout@v4
        if: steps.merge.outputs.merged == 'true'
        with:
          ref: main
          fetch-depth: 0  # tags needed for the idempotent tag check

      - uses: pnpm/action-setup@v4
        if: steps.merge.outputs.merged == 'true'
        with:
          version: 10.33.4

      - uses: actions/setup-node@v4
        if: steps.merge.outputs.merged == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        if: steps.merge.outputs.merged == 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Guard — no pending changesets on the merged main
        if: steps.merge.outputs.merged == 'true'
        run: |
          PENDING=$(find .changeset -name '*.md' ! -name 'README.md' | wc -l)
          if [ "$PENDING" -ne 0 ]; then
            echo "::error::main still has $PENDING unconsumed changesets — refusing to tag."
            exit 1
          fi

      - name: Tag and dispatch the Foundry module release
        if: steps.merge.outputs.merged == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm run release:tag
